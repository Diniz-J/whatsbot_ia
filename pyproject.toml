[project]
name = "whatsbot-ia"
version = "0.1.0"
description = "Atendimento automatizado no WhatsApp para pequenos negocios"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.0,<2",
    "celery[redis]>=5.6,<6",
    "dj-database-url>=3.1,<4",
    # 5.2 e LTS (suporte ate abr/2028) e e o mesmo major do Diario-Escolar.
    "django>=5.2,<5.3",
    "django-unfold>=0.110",
    "djangorestframework>=3.18,<4",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.3,<4",
    "python-decouple>=3.8,<4",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-django>=4.14",
    "ruff>=0.17",
]

[tool.uv]
# Aplicacao, nao biblioteca: nao ha nada para empacotar.
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Migration e codigo gerado: o help_text longo vem do proprio Django.
"*/migrations/*" = ["E501"]
