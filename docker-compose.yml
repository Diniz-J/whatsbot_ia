# Dependencias de desenvolvimento. A aplicacao roda na maquina via uv; aqui
# ficam so banco e broker. Tag sempre explicita, nunca `latest`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whatsbot_ia
      POSTGRES_USER: whatsbot
      POSTGRES_PASSWORD: whatsbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsbot -d whatsbot_ia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
